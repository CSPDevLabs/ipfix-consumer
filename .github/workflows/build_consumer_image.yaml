name: Test and Build nok-ipfix-consumer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ipfix-consumer
        run: |
          python -m pip install --upgrade pip
          pip install -r consumer/requirements.txt
          pip install pytest

      - name: Run IPFIX consumer unit tests
        working-directory: ipfix-consumer
        run: |
          python -m pytest -v tests/test_consumer_unit.py

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nok-ipfix-consumer
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push IPFIX consumer Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ipfix-consumer/consumer
          file: ./ipfix-consumer/consumer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
