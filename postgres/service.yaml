
# ============================================================
# 3. PostgreSQL Client Service
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: ipfix-postgres
  namespace: nok-ipfix
spec:
  type: ClusterIP

  selector:
    app: ipfix-postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
